<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel administratora</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="container"><h1>Panel administratora</h1><a href="/" style="color:white">Widok użytkownika</a></div></header><main class="container"><div id="notice" class="notice hidden"></div><section id="login" class="card"><h2>Logowanie administratora</h2><form id="login-form"><label>E-mail<input name="email" type="email" required></label><label>Hasło<input name="password" type="password" required></label><button>Zaloguj</button></form></section><div id="dashboard" class="hidden"><section><h2>Nowe wydarzenie</h2><form id="event-form"><label>Nazwa<input name="name" required></label><label>Opis<textarea name="description"></textarea></label><label>Termin<input name="eventDatetime" type="datetime-local" required></label><label>Pojemność<input name="capacity" type="number" min="1" value="12" required></label><button>Utwórz wydarzenie</button></form></section><section><h2>Wydarzenia</h2><div id="events" class="grid"></div></section><section><h2>Użytkownicy</h2><form id="user-form"><label>E-mail<input name="email" type="email" required></label><label>Imię i nazwisko<input name="fullName" required></label><label>Rola<select name="role"><option value="user">Użytkownik</option><option value="admin">Administrator</option></select></label><label>Tymczasowe hasło (opcjonalne)<input name="password" type="password"></label><button>Dodaj użytkownika</button></form><div id="users"></div></section></div></main><script type="module" src="/admin.js"></script></body></html>
