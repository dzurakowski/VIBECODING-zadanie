<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zapisy na wydarzenia</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="container"><h1>Zapisy na wydarzenia</h1><div id="session"></div></div></header><main class="container"><div id="notice" class="notice hidden"></div><section id="login" class="card"><h2>Zaloguj się</h2><form id="login-form"><label>E-mail<input name="email" type="email" required></label><label>Hasło<input name="password" type="password" required></label><div class="actions"><button>Zaloguj</button><button class="secondary" type="button" id="magic">Wyślij magic link</button><button class="secondary" type="button" id="reset">Nie pamiętam hasła</button></div></form></section><section id="password-section" class="card hidden"><h2>Zmień hasło</h2><form id="password-form"><label>Obecne hasło<input name="currentPassword" type="password" required></label><label>Nowe hasło (minimum 10 znaków)<input name="password" type="password" minlength="10" required></label><label>Powtórz nowe hasło<input name="passwordConfirmation" type="password" minlength="10" required></label><button>Zmień hasło</button></form></section><section id="events-section" class="hidden"><h2>Bieżące wydarzenia</h2><div id="events" class="grid"></div></section><section id="mine-section" class="hidden"><h2>Moje zapisy</h2><div id="mine" class="grid"></div></section></main><script type="module" src="/app.js"></script></body></html>
