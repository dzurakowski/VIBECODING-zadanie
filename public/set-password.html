<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ustaw hasło</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth">
  <main class="container">
    <div class="brand" style="margin-bottom:16px"><span class="brand-dot"></span>STREFA WYDARZEŃ</div>
    <section class="card">
      <h1>Ustaw nowe hasło</h1>
      <div id="notice" class="notice hidden"></div>
      <form id="set-password-form">
        <label>Nowe hasło (minimum 10 znaków)<input name="password" type="password" minlength="10" required></label>
        <label>Powtórz nowe hasło<input name="passwordConfirmation" type="password" minlength="10" required></label>
        <button>Ustaw hasło</button>
      </form>
    </section>
  </main>
  <script type="module" src="/set-password.js"></script>
</body>
</html>
